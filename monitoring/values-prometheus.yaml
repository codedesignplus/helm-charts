server:
  retention: "15d"
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: microk8s-hostpath
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  extraArgs:
    web.enable-remote-write-receiver: ""

alertmanager:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
