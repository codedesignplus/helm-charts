ms-base:
  environment: Staging
  replicaCount: 1

  image:
    repository: codedesignplus/ms-locations-grpc
    pullPolicy: IfNotPresent
    tag: "latest"

  imagePullSecrets: []
  fullnameOverride: "ms-locations-grpc"
  nameOverride: "ms-locations-grpc"

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    type: ClusterIP
    ports:
      - name: http
        port: 5000
        targetPort: http
        protocol: TCP
      - name: grpc
        port: 5001
        targetPort: grpc
        protocol: TCP

  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: services.codedesignplus.com
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - services.codedesignplus.com

  resources:
    # MEDIDO sobre 76 pods en staging: mediana 109 MiB, p95 135, maximo 164.
    #
    # Sin peticiones el planificador cree que el pod no ocupa nada y los
    # amontona: se llego a 61 pods en un nodo y 21 en otro, con el primero al
    # 109% de memoria matando procesos del sistema.
    #
    # SIN LIMITE DE CPU A PROPOSITO: estrangula el arranque, que es cuando el
    # micro mas CPU necesita, y hace que la sonda lo mate antes de terminar.
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 320Mi

  livenessProbe:
    httpGet:
      path: /health/live
      port: http
  readinessProbe:
    httpGet:
      path: /health/ready
      port: http

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    # ESCALA POR CPU, NO POR MEMORIA, y el motivo importa.
    #
    # El HPA calcula el porcentaje contra la PETICION. Un micro de .NET reserva
    # memoria y no la devuelve, asi que con 109 MiB de uso sobre 128Mi pedidos
    # da 85%: por encima de cualquier objetivo razonable, con la CPU al 2%.
    #
    # Y escalar no lo arregla: cada replica nueva arranca igual de alta, el
    # promedio no baja y sube hasta maxReplicas sin que haya carga. Se vio en
    # ms-microsoftgraph, con 4 replicas y la CPU al 2%.
    #
    # La memoria aqui es una linea base del runtime, no una senal de carga.
    targetCPUUtilizationPercentage: 80

  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

  nodeSelector: {}

  tolerations: []

  affinity: {}

  virtualService: 
    create: true
    spec:
      hosts:
        - services.codedesignplus.com
      gateways:
        - istio-ingress/istio-gateway
      http:
      - name: ms-locations
        match:
        - uri:
            prefix: /ms-locations/
        rewrite:
          uri: /
        route:
        - destination:
            host: ms-locations-grpc.urbancore.svc.cluster.local
            port:
              number: 5000